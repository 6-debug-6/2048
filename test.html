<!DOCTYPE html>
<html>

<head>
    <title>表单测试</title>
</head>

<body>
    <form name="input" onsubmit="return handleSubmit(event)">
        Username: <input type="text" name="user" id="username">
        <input type="submit" value="Submit">
    </form>

    <div id="result" style="margin-top: 20px; padding: 10px; border: 1px solid #ccc; display: none;">
        <h3>提交结果：</h3>
        <p id="resultText"></p>
    </div>

    <script>
        function handleSubmit(event) {
            event.preventDefault(); // 阻止默认提交行为

            const username = document.getElementById('username').value;
            const resultDiv = document.getElementById('result');
            const resultText = document.getElementById('resultText');

            resultText.textContent = `用户名: ${username} (GET方式提交)`;
            resultDiv.style.display = 'block';

            // 模拟URL参数变化
            window.history.pushState({}, '', `?user=${encodeURIComponent(username)}`);

            return false;
        }

        // 页面加载时显示URL中的参数
        window.onload = function () {
            const params = new URLSearchParams(window.location.search);
            const user = params.get('user');
            if (user) {
                document.getElementById('username').value = user;
                document.getElementById('resultText').textContent = `用户名: ${user} (来自URL参数)`;
                document.getElementById('result').style.display = 'block';
            }
        };
    </script>
    <br>
    <br>
    <!--非服务器环境提交表单会变成下载文件-->
    <form name="input" action="https://httpbin.org/get" method="get" target="_blank">
        Username: <input type="text" name="user">
        <input type="submit" value="Submit">
    </form>
    <br>
    <br>
    <!-- 以下表单使用 GET 请求发送数据到当前的 URL，method 默认为 GET。 -->
    <form>
        <label>Name:
            <input name="submitted-name" autocomplete="name">
        </label>
        <button>Save</button>
    </form>
    <br>
    <br>
    <!-- 以下表单使用 POST 请求发送数据到当前的 URL。 -->
    <form method="post">
        <label>Name:
            <input name="submitted-name" autocomplete="name">
        </label>
        <button>Save</button>
    </form>
    <br>
    <br>
    <!-- 表单使用 fieldset, legend, 和 label 标签 -->
    <form method="post">
        <fieldset>
            <legend>Title</legend>
            <label><input type="radio" name="radio"> Select me</label>
        </fieldset>
    </form>
</body>

</html>
