<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日历与天气组件</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* 所有样式都封装在组件容器内，使用ID选择器确保只影响容器内部 */
        #calendarWeatherWidget {
            /* CSS变量只在组件内部有效 */
            --primary-color: #4361ee;
            --secondary-color: #3a0ca3;
            --light-color: #f8f9fa;
            --dark-color: #212529;
            --success-color: #4cc9f0;
            --danger-color: #f72585;
            --border-radius: 12px;
            --box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);

            /* 组件容器的基础样式 */
            display: flex;
            flex-direction: column;
            gap: 25px;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            box-sizing: border-box;
        }

        /* 只重置组件内部元素的样式 */
        #calendarWeatherWidget *,
        #calendarWeatherWidget *::before,
        #calendarWeatherWidget *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* 日历样式 */
        #calendarWeatherWidget .calendar-section {
            background-color: white;
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            overflow: hidden;
        }

        #calendarWeatherWidget .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background-color: var(--primary-color);
            color: white;
        }

        #calendarWeatherWidget .calendar-header h2 {
            font-size: 1.5rem;
            font-weight: 600;
        }

        #calendarWeatherWidget .calendar-nav {
            display: flex;
            gap: 15px;
        }

        #calendarWeatherWidget .calendar-nav button {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        #calendarWeatherWidget .calendar-nav button:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.05);
        }

        #calendarWeatherWidget .calendar-weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            background-color: #f1f3f9;
            padding: 15px 0;
            text-align: center;
            font-weight: 600;
            color: var(--dark-color);
        }

        #calendarWeatherWidget .calendar-days {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 1px;
            background-color: #e9ecef;
        }

        #calendarWeatherWidget .calendar-day {
            background-color: white;
            padding: 20px 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            min-height: 90px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
        }

        #calendarWeatherWidget .calendar-day:hover {
            background-color: #f8f9fa;
            transform: translateY(-2px);
        }

        #calendarWeatherWidget .calendar-day.current-month {
            color: var(--dark-color);
        }

        #calendarWeatherWidget .calendar-day.other-month {
            color: #adb5bd;
            background-color: #f8f9fa;
        }

        #calendarWeatherWidget .calendar-day.today {
            background-color: rgba(67, 97, 238, 0.1);
            border: 2px solid var(--primary-color);
            font-weight: bold;
        }

        #calendarWeatherWidget .day-number {
            font-size: 1.2rem;
            margin-bottom: 5px;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }

        #calendarWeatherWidget .today .day-number {
            background-color: var(--primary-color);
            color: white;
        }

        #calendarWeatherWidget .calendar-events {
            font-size: 0.7rem;
            color: var(--secondary-color);
            margin-top: 5px;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* 天气样式 */
        #calendarWeatherWidget .weather-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
        }

        #calendarWeatherWidget .weather-card {
            background-color: white;
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            overflow: hidden;
        }

        #calendarWeatherWidget .weather-header {
            padding: 20px;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
        }

        #calendarWeatherWidget .weather-header h2 {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.5rem;
            margin-bottom: 10px;
        }

        #calendarWeatherWidget .weather-location {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #calendarWeatherWidget .current-weather {
            padding: 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        #calendarWeatherWidget .temperature {
            font-size: 3.5rem;
            font-weight: 300;
        }

        #calendarWeatherWidget .weather-details {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        #calendarWeatherWidget .weather-detail {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #calendarWeatherWidget .forecast {
            padding: 20px;
            border-top: 1px solid #e9ecef;
        }

        #calendarWeatherWidget .forecast h3 {
            margin-bottom: 15px;
            color: var(--dark-color);
        }

        #calendarWeatherWidget .forecast-days {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        #calendarWeatherWidget .forecast-day {
            text-align: center;
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            background-color: #f8f9fa;
            transition: all 0.3s ease;
        }

        #calendarWeatherWidget .forecast-day:hover {
            background-color: #e9ecef;
            transform: translateY(-3px);
        }

        #calendarWeatherWidget .forecast-day-name {
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--dark-color);
        }

        #calendarWeatherWidget .forecast-icon {
            font-size: 1.5rem;
            margin: 8px 0;
            color: var(--primary-color);
        }

        #calendarWeatherWidget .forecast-temp {
            font-weight: 600;
            color: var(--dark-color);
        }

        /* 响应式设计 */
        @media (max-width: 768px) {

            #calendarWeatherWidget .calendar-weekdays,
            #calendarWeatherWidget .calendar-day {
                padding: 10px 5px;
                min-height: 70px;
            }

            #calendarWeatherWidget .day-number {
                width: 30px;
                height: 30px;
            }

            #calendarWeatherWidget .temperature {
                font-size: 2.5rem;
            }

            #calendarWeatherWidget .forecast-days {
                flex-wrap: wrap;
            }

            #calendarWeatherWidget .forecast-day {
                flex: 0 0 calc(33.333% - 10px);
            }
        }

        @media (max-width: 480px) {

            #calendarWeatherWidget .calendar-weekdays,
            #calendarWeatherWidget .calendar-day {
                padding: 8px 2px;
                min-height: 60px;
                font-size: 0.9rem;
            }

            #calendarWeatherWidget .day-number {
                width: 26px;
                height: 26px;
                font-size: 1rem;
            }

            #calendarWeatherWidget .forecast-day {
                flex: 0 0 calc(50% - 10px);
            }
        }

        /* 链接样式 */
        #calendarWeatherWidget a {
            background-color: var(--primary-color);
            color: white;
            padding: 8px 15px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.9rem;
            display: inline-block;
            transition: background-color 0.3s ease;
        }

        #calendarWeatherWidget a:hover {
            background-color: var(--secondary-color);
        }

        #calendarWeatherWidget a:nth-of-type(2) {
            background-color: var(--secondary-color);
        }

        #calendarWeatherWidget a:nth-of-type(2):hover {
            background-color: #2a0a8a;
        }

        /* 按钮样式 */
        #calendarWeatherWidget button {
            cursor: pointer;
        }

        #calendarWeatherWidget #changeLocation {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        #calendarWeatherWidget #changeLocation:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.05);
        }
    </style>
</head>

<body>
    <!-- 这是您可以插入到现有div中的组件 -->
    <!-- 注意：容器div必须有id="calendarWeatherWidget" -->
    <div id="calendarWeatherWidget">
        <!-- 日历部分 -->
        <section class="calendar-section">
            <div class="calendar-header">
                <h2 id="currentMonthYear">2023年10月</h2>
                <div class="calendar-nav">
                    <button id="prevMonth" title="上一月"><i class="fas fa-chevron-left"></i></button>
                    <button id="todayBtn" title="返回今天">今天</button>
                    <button id="nextMonth" title="下一月"><i class="fas fa-chevron-right"></i></button>
                </div>
            </div>

            <div class="calendar-weekdays">
                <div>日</div>
                <div>一</div>
                <div>二</div>
                <div>三</div>
                <div>四</div>
                <div>五</div>
                <div>六</div>
            </div>

            <div class="calendar-days" id="calendarDays">
                <!-- 日历天数将由JavaScript动态生成 -->
            </div>
        </section>

        <!-- 天气部分 -->
        <section class="weather-section">
            <!-- 当前天气 -->
            <div class="weather-card">
                <div class="weather-header">
                    <h2><i class="fas fa-sun"></i> 当前天气</h2>
                    <div class="weather-location">
                        <div>
                            <h3 id="currentLocation">北京, 中国</h3>
                            <p id="currentDate">2023年10月15日 星期日</p>
                        </div>
                        <button id="changeLocation" title="更改位置"><i class="fas fa-map-marker-alt"></i></button>
                    </div>
                </div>

                <div class="current-weather">
                    <div>
                        <div class="temperature" id="currentTemp">22°C</div>
                        <div id="weatherCondition">晴朗</div>
                    </div>
                    <div class="weather-details">
                        <div class="weather-detail">
                            <i class="fas fa-wind"></i>
                            <span>风速: <span id="windSpeed">12 km/h</span></span>
                        </div>
                        <div class="weather-detail">
                            <i class="fas fa-tint"></i>
                            <span>湿度: <span id="humidity">45%</span></span>
                        </div>
                        <div class="weather-detail">
                            <i class="fas fa-temperature-high"></i>
                            <span>体感温度: <span id="feelsLike">21°C</span></span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 天气预报 -->
            <div class="weather-card">
                <div class="forecast">
                    <h3>5天预报</h3>
                    <div class="forecast-days" id="forecastDays">
                        <!-- 天气预报将由JavaScript动态生成 -->
                    </div>
                </div>

                <div class="forecast">
                    <h3>天气信息来源</h3>
                    <p style="margin-bottom: 15px; color: #666; font-size: 0.9rem;">
                        天气数据来自免费公共API，您可以根据需要替换为其他天气服务。
                    </p>
                    <div style="display: flex; gap: 10px;">
                        <a href="https://openweathermap.org/api" target="_blank">
                            OpenWeather API
                        </a>
                        <a href="https://www.weather.gov/documentation/services-web-api" target="_blank">
                            Weather.gov API
                        </a>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <script>
        // 日历功能
        class Calendar {
            constructor() {
                this.currentDate = new Date();
                this.today = new Date();
                this.events = [
                    { date: new Date(2023, 9, 15), title: "团队会议" },
                    { date: new Date(2023, 9, 18), title: "项目截止" },
                    { date: new Date(2023, 9, 22), title: "医生预约" },
                    { date: new Date(2023, 9, 25), title: "生日聚会" }
                ];

                this.init();
            }

            init() {
                this.renderCalendar();
                this.setupEventListeners();
            }

            renderCalendar() {
                const monthYearElement = document.getElementById('currentMonthYear');
                const calendarDaysElement = document.getElementById('calendarDays');

                // 设置月份标题
                const monthNames = ["1月", "2月", "3月", "4月", "5月", "6月", "7月", "8月", "9月", "10月", "11月", "12月"];
                monthYearElement.textContent = `${this.currentDate.getFullYear()}年 ${monthNames[this.currentDate.getMonth()]}`;

                // 清空日历
                calendarDaysElement.innerHTML = '';

                // 获取当前月份的第一天
                const firstDayOfMonth = new Date(this.currentDate.getFullYear(), this.currentDate.getMonth(), 1);
                // 获取当前月份的第一天是星期几 (0 = 星期日, 6 = 星期六)
                const firstDayOfWeek = firstDayOfMonth.getDay();

                // 获取当前月份的最后一天
                const lastDayOfMonth = new Date(this.currentDate.getFullYear(), this.currentDate.getMonth() + 1, 0);
                // 获取当前月份的总天数
                const totalDaysInMonth = lastDayOfMonth.getDate();

                // 获取上个月的最后几天
                const prevMonthLastDay = new Date(this.currentDate.getFullYear(), this.currentDate.getMonth(), 0).getDate();

                // 生成日历天数
                let dayCount = 1;

                // 添加上个月的日期
                for (let i = firstDayOfWeek; i > 0; i--) {
                    const day = document.createElement('div');
                    day.className = 'calendar-day other-month';
                    day.innerHTML = `<div class="day-number">${prevMonthLastDay - i + 1}</div>`;
                    calendarDaysElement.appendChild(day);
                }

                // 添加当前月份的日期
                for (let i = 1; i <= totalDaysInMonth; i++) {
                    const day = document.createElement('div');
                    const dayDate = new Date(this.currentDate.getFullYear(), this.currentDate.getMonth(), i);

                    // 检查是否是今天
                    const isToday = dayDate.toDateString() === this.today.toDateString();

                    // 检查是否有事件
                    const dayEvents = this.events.filter(event =>
                        event.date.toDateString() === dayDate.toDateString()
                    );

                    day.className = `calendar-day current-month ${isToday ? 'today' : ''}`;
                    day.innerHTML = `
                        <div class="day-number">${i}</div>
                        ${dayEvents.length > 0 ?
                            `<div class="calendar-events">${dayEvents[0].title}</div>` :
                            ''
                        }
                    `;

                    // 添加点击事件
                    day.addEventListener('click', () => {
                        this.selectDay(dayDate);
                    });

                    calendarDaysElement.appendChild(day);
                    dayCount++;
                }

                // 添加下个月的日期
                const totalCells = 42; // 6行 x 7列
                const nextMonthDays = totalCells - (firstDayOfWeek + totalDaysInMonth);

                for (let i = 1; i <= nextMonthDays; i++) {
                    const day = document.createElement('div');
                    day.className = 'calendar-day other-month';
                    day.innerHTML = `<div class="day-number">${i}</div>`;
                    calendarDaysElement.appendChild(day);
                }
            }

            selectDay(date) {
                alert(`您选择了: ${date.toLocaleDateString('zh-CN')}`);
                // 这里可以添加更多选择日期的功能
            }

            setupEventListeners() {
                document.getElementById('prevMonth').addEventListener('click', () => {
                    this.currentDate.setMonth(this.currentDate.getMonth() - 1);
                    this.renderCalendar();
                });

                document.getElementById('nextMonth').addEventListener('click', () => {
                    this.currentDate.setMonth(this.currentDate.getMonth() + 1);
                    this.renderCalendar();
                });

                document.getElementById('todayBtn').addEventListener('click', () => {
                    this.currentDate = new Date();
                    this.renderCalendar();
                });
            }
        }

        // 天气功能 - 模拟数据（实际使用时可以替换为真实的API调用）
        class Weather {
            constructor() {
                this.currentLocation = "北京";
                this.locations = {
                    "北京": { temp: 22, condition: "晴朗", humidity: 45, windSpeed: 12, feelsLike: 21 },
                    "上海": { temp: 24, condition: "多云", humidity: 60, windSpeed: 8, feelsLike: 23 },
                    "广州": { temp: 28, condition: "部分多云", humidity: 70, windSpeed: 10, feelsLike: 29 },
                    "成都": { temp: 20, condition: "小雨", humidity: 80, windSpeed: 6, feelsLike: 19 }
                };

                this.forecastData = {
                    "北京": [
                        { day: "周一", icon: "fa-sun", high: 23, low: 15 },
                        { day: "周二", icon: "fa-cloud-sun", high: 21, low: 14 },
                        { day: "周三", icon: "fa-cloud", high: 19, low: 13 },
                        { day: "周四", icon: "fa-cloud-rain", high: 18, low: 12 },
                        { day: "周五", icon: "fa-cloud-sun", high: 20, low: 13 }
                    ],
                    "上海": [
                        { day: "周一", icon: "fa-cloud", high: 25, low: 18 },
                        { day: "周二", icon: "fa-cloud-sun", high: 24, low: 17 },
                        { day: "周三", icon: "fa-sun", high: 26, low: 19 },
                        { day: "周四", icon: "fa-cloud-rain", high: 22, low: 16 },
                        { day: "周五", icon: "fa-cloud", high: 23, low: 17 }
                    ]
                };

                this.init();
            }

            init() {
                this.renderCurrentWeather();
                this.renderForecast();
                this.setupEventListeners();
                this.updateCurrentDate();
            }

            renderCurrentWeather() {
                const locationData = this.locations[this.currentLocation];

                document.getElementById('currentLocation').textContent = `${this.currentLocation}, 中国`;
                document.getElementById('currentTemp').textContent = `${locationData.temp}°C`;
                document.getElementById('weatherCondition').textContent = locationData.condition;
                document.getElementById('windSpeed').textContent = `${locationData.windSpeed} km/h`;
                document.getElementById('humidity').textContent = `${locationData.humidity}%`;
                document.getElementById('feelsLike').textContent = `${locationData.feelsLike}°C`;
            }

            renderForecast() {
                const forecastDaysElement = document.getElementById('forecastDays');
                forecastDaysElement.innerHTML = '';

                const forecastData = this.forecastData[this.currentLocation] || this.forecastData["北京"];

                forecastData.forEach(day => {
                    const dayElement = document.createElement('div');
                    dayElement.className = 'forecast-day';
                    dayElement.innerHTML = `
                        <div class="forecast-day-name">${day.day}</div>
                        <div class="forecast-icon"><i class="fas ${day.icon}"></i></div>
                        <div class="forecast-temp">${day.high}° / ${day.low}°</div>
                    `;
                    forecastDaysElement.appendChild(dayElement);
                });
            }

            updateCurrentDate() {
                const now = new Date();
                const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
                document.getElementById('currentDate').textContent = now.toLocaleDateString('zh-CN', options);
            }

            setupEventListeners() {
                document.getElementById('changeLocation').addEventListener('click', () => {
                    const locations = Object.keys(this.locations);
                    const currentIndex = locations.indexOf(this.currentLocation);
                    const nextIndex = (currentIndex + 1) % locations.length;
                    this.currentLocation = locations[nextIndex];
                    this.renderCurrentWeather();
                    this.renderForecast();
                });
            }
        }

        // 初始化组件
        document.addEventListener('DOMContentLoaded', () => {
            const calendar = new Calendar();
            const weather = new Weather();

            // 这里可以添加与外部API集成的代码
            // 例如，使用fetch从天气API获取真实数据
            /*
            fetch('https://api.openweathermap.org/data/2.5/weather?q=Beijing&appid=YOUR_API_KEY&units=metric&lang=zh_cn')
                .then(response => response.json())
                .then(data => {
                    // 处理天气数据
                })
                .catch(error => console.error('Error fetching weather:', error));
            */
        });
    </script>
</body>

</html>
