<script>
    //头像预览功能
    document.getElementById('image').addEventListener('change', function (event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function (e) {
                const previewImg = document.getElementById('previewImg');
                previewImg.src = e.target.result;
                previewImg.style.display = 'block';
            }
            reader.readAsDataURL(file);
        }
    });
    //选择猫娘物种时弹出提示
    function Cat() {
        var isCat = document.getElementById('name').value;
        if (isCat == "谢锦潇" || isCat == "锦潇" || isCat == "阿潇") {
            alert('其他人都是猫娘~喵~(●\'◡\'●)');
            document.getElementById('human').checked = true;
        } else if (isCat) {
            alert('我是' + isCat + '，我是猫娘~喵~(●\'◡\'●)');

        } else {
            alert('我是猫娘~喵~(●\'◡\'●)');
        }
    }
    //选择人类物种时弹出提示
    function Human() {
        var isHuman = document.getElementById('name').value;
        if (isHuman != "谢锦潇" && isHuman != "锦潇" && isHuman != "阿潇") {
            alert('不！你不是人类！');

            document.getElementById('cat').checked = true;
        }
    }
    //提交表单时弹出提示
    function Give() {
        var name = document.getElementById('name').value;
        if (name == "谢锦潇" || name == "锦潇" || name == "阿潇") {
            alert('都说了别填组长的名字了！你咋不听话呢？(╯▔皿▔)╯' + '\n表单已重置，请重新填写。');
            document.getElementById('reset').click();
        } else if (name) {
            alert('感谢' + name + '同学的提交！');
        }
        else {
            alert('请填写姓名后再提交！');
        }
    }
</script>
