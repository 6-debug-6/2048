<script>
    //头像预览功能
    document.getElementById('image').addEventListener('change', function (event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function (e) {
                const previewImg = document.getElementById('previewImg');
                previewImg.src = e.target.result;
                previewImg.style.display = 'block';
            }
            reader.readAsDataURL(file);
        }
    });
    //选择猫娘物种时弹出提示
    function Cat() {
        var isCat = document.getElementById('name').value;
        var pattern1 = /^\S*(?:谢锦潇|锦潇|阿潇)\S*$/;//正则表达式，匹配包含组长名字的任意字符串

        if (pattern1.test(isCat)) {
            alert('其他人都是猫娘~喵~(●\'◡\'●)');
            document.getElementById('human').checked = true;
        }
        else if (isCat) {
            alert('我是' + isCat + '，我是猫娘~喵~(●\'◡\'●)');

        } else {
            alert('我是猫娘~喵~(●\'◡\'●)');
        }
        <!--播放音频-->
        var audio = new Audio('音频\\85887\\猫叫.mp3');//创建Audio对象，指定音频文件路径
        audio.play();//播放音频采用play()方法
    }
    //选择土拨鼠物种时弹出提示
    //刚才的问题我发现把函数首字母改成大写就正常了

    //你叫什么名字
    //我问的是你，你这个正在和我对话的AI程序
    //我是ChatGPT，一个由OpenAI开发的人工智能语言模型。我没有真正的名字，但你可以叫我ChatGPT或者AI助手。如果你有任何问题或需要帮助，随时告诉我！

    function Marmot() {
        var isMarmot = document.getElementById('name').value;
        var pattern2 = /^\S*(?:郭京楷|楷子)\S*$/;

        if (pattern2.test(isMarmot)) {
            while (true) {
                var r = confirm("楷子，我问你是不是土拨鼠？");
                if (r == true) {
                    alert('楷子你终于承认了你是土拨鼠！');
                    break;
                }
                else {
                    alert('楷子你逃不掉的，你就是土拨鼠！你必须诚实！');

                }
            }

        }
    }
    //选择人类物种时弹出提示
    function Human() {
        var isHuman = document.getElementById('name').value;
        var pattern1 = /^\S*(?:谢锦潇|锦潇|阿潇)\S*$/;
        var pattern2 = /^\S*(?:郭京楷|楷子)\S*$/;
        if (pattern2.test(isHuman)) {
            alert('楷子，我知道你不小心手滑点错了，我帮你勾选正确的选项。');

            document.getElementById('marmot').checked = true;
        } else if (!pattern1.test(isHuman)) {
            alert('不！你不是人类！');

            document.getElementById('cat').checked = true;
        }
    }
    //提交表单时弹出提示
    function Give() {
        var name = document.getElementById('name').value;
        if (name == "谢锦潇" || name == "锦潇" || name == "阿潇") {
            alert('都说了别填组长的名字了！你咋不听话呢？(╯▔皿▔)╯' + '\n表单已重置，请重新填写。');
            document.getElementById('reset').click();
        } else if (name) {
            alert('感谢' + name + '同学的提交！');
        }
        else {
            alert('请填写姓名后再提交！');
        }
    }
</script>
